name: ci-cd
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test test/widget_test.dart
      - name: Validate agent reports
        run: python tools/validate_agent_reports.py
      - name: Validate documentation links and diagrams
        shell: pwsh
        run: |
          $files = Get-ChildItem docs -Recurse -Filter *.md
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            if ($text -match '\]\((\.\.?/)') {
              $links = [regex]::Matches($text, '\]\((\.\.?/[^)#]+)')
              foreach ($link in $links) {
                $target = Join-Path $file.DirectoryName $link.Groups[1].Value
                if (-not (Test-Path $target)) { throw "Link documental inválido: $($file.FullName) -> $target" }
              }
            }
          }
      - name: Run traceability evidence
        run: python tools/run_traceability_tests.py
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: traceability-evidence
          path: artifacts/traceability
  tdd-red:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: flutter pub get
      - name: Capture RED evidence
        shell: pwsh
        continue-on-error: true
        run: flutter test test/tdd_red_gate_test.dart 2>&1 | Tee-Object tdd-red.log
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: tdd-red-evidence
          path: tdd-red.log
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - run: dart run msix:create --store --sign-msix false --output-path build\msix --output-name template-flutter
      - name: Validate artifacts
        shell: pwsh
        run: |
          $a = Get-Item build\msix\template-flutter.msix
          if($a.Length -eq 0){throw 'MSIX inválido'}
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: template-flutter-windows-msix
          path: build/msix/template-flutter.msix
          if-no-files-found: error
  uwp-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Build UWP shell
        shell: pwsh
        run: |
          $m = Get-Command msbuild -ErrorAction Stop
          & $m.Source platforms\uwp-shell\UwpShell.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never
      - name: Validate UWP package
        shell: pwsh
        run: |
          $a = Get-ChildItem -Recurse -Filter *.appx | Select-Object -First 1
          if (-not $a -or $a.Length -eq 0) { throw 'UWP MSIX inválido' }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: template-flutter-uwp-msix
          path: '**/*.appx'
          if-no-files-found: error
